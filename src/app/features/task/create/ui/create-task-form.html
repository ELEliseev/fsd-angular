<form class="create-form" (submit)="onSubmit($event)">
  <div class="create-form__row">
    <ui-input label="Название" placeholder="Что нужно сделать?" [(value)]="title" />
    <ui-select
      label="Приоритет"
      [options]="priorityOptions"
      [value]="priority()"
      (valueChange)="setPriority($event)"
    />
  </div>
  <ui-input
    label="Описание"
    placeholder="Детали (необязательно)"
    [multiline]="true"
    [(value)]="description"
  />
  <div class="create-form__actions">
    <ui-button type="submit" [disabled]="!canSubmit()">Создать задачу</ui-button>
    <ui-button variant="ghost" (click)="cancelled.emit()">Отмена</ui-button>
  </div>
</form>
