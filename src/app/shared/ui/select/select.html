<label class="field">
  @if (label()) {
    <span class="field__label">{{ label() }}</span>
  }
  <select class="field__control" [value]="value()" (change)="onChange($event)">
    @for (option of options(); track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    }
  </select>
</label>
