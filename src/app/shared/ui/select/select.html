<label class="field">
  @if (label()) {
    <span class="field__label">{{ label() }}</span>
  }
  <select class="field__control" (change)="onChange($event)">
    @for (option of options(); track option.value) {
      <option [value]="option.value" [selected]="option.value === value()">
        {{ option.label }}
      </option>
    }
  </select>
</label>
