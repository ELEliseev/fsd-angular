<article class="card">
  <div class="card__meta">
    <priority-badge [priority]="task().priority" />
    <div class="card__meta-right">
      @if (task().assignee; as assignee) {
        <span class="card__assignee">
          <user-avatar [user]="assignee" />
          {{ assignee.name }}
        </span>
      }
      <time class="card__date">{{ createdAt() }}</time>
    </div>
  </div>
  <h3 class="card__title">{{ task().title }}</h3>
  @if (task().description) {
    <p class="card__description">{{ task().description }}</p>
  }
  <div class="card__actions">
    <ng-content select="[card-actions]" />
  </div>
</article>
